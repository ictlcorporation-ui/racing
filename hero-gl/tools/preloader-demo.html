<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preloader MM 69 — 3 variante</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@1,500&family=Manrope:wght@500;700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root{--cream:#F1F0EB;--black:#111112;--red:#D81F26;--ink:#1a1a18;--d:'Anton',Impact,sans-serif;--s:'Playfair Display',Georgia,serif;--b:'Manrope',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#000;font-family:var(--b)}
  .site{position:fixed;inset:0;background:url(preloader-bg.jpg) center/cover}
  @media (max-aspect-ratio:3/4){.site{background-image:url(preloader-bg-m.jpg)}}
  .ui{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;display:flex;gap:6px;background:rgba(17,17,18,.85);padding:6px;border-radius:10px}
  .ui button{font:700 11px var(--b);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:8px 11px;cursor:pointer}
  .ui button.on{background:var(--red);border-color:var(--red)}
  .pl{position:fixed;inset:0;z-index:50;pointer-events:none}
  .mm path{fill:none;stroke:currentColor;stroke-width:6.5;stroke-linejoin:miter;stroke-dasharray:1;stroke-dashoffset:1}
  .lbl{font:700 11px var(--b);letter-spacing:.16em;text-transform:uppercase}

  /* ---------- 1. START ---------- */
  .p1 .half{position:absolute;left:0;right:0;height:50.5%;background:var(--black)}
  .p1 .half.t{top:0}.p1 .half.b{bottom:0}
  .p1 .core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#EDEBE4}
  .p1 .mm{width:min(46vw,300px);height:auto;overflow:visible}
  .p1 .n69{font-family:var(--d);font-size:22px;fill:var(--red);opacity:0}
  .p1 .lights{display:flex;gap:min(3.2vw,18px);margin-top:min(7vw,44px)}
  .p1 .lights i{width:min(6vw,30px);aspect-ratio:1;border-radius:50%;background:#2a2a28;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:background .12s,box-shadow .12s}
  .p1 .lights i.on{background:var(--red);box-shadow:0 0 18px 2px rgba(216,31,38,.65)}
  .p1 .count{font-family:var(--d);font-size:min(9vw,56px);line-height:1;margin-top:min(5vw,28px);height:1em;overflow:hidden;min-width:3ch;text-align:center}
  .p1 .count span{display:block}
  .p1 .meta{position:absolute;left:24px;right:24px;bottom:22px;display:flex;justify-content:space-between;color:rgba(237,235,228,.55)}
  .p1 .meta b{color:#EDEBE4}

  /* ---------- 2. CRONOMETRU ---------- */
  .p2 .panel{position:absolute;inset:0;background:var(--cream);color:var(--ink);will-change:transform}
  .p2 .top{position:absolute;left:28px;right:28px;top:24px;display:flex;justify-content:space-between;align-items:center}
  .p2 .mm{width:64px;height:auto;overflow:visible}
  .p2 .mm path{stroke-dashoffset:0}
  .p2 .n69{font-family:var(--d);font-size:22px;fill:var(--red)}
  .p2 .clock{position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);text-align:center}
  .p2 .clock .t{font-family:var(--d);font-size:min(21vw,250px);line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .p2 .clock .t small{font-size:.42em;color:var(--red)}
  .p2 .clock .sub{font-family:var(--s);font-style:italic;font-size:min(5vw,26px);color:var(--red);margin-top:8px}
  .p2 .rail{position:absolute;left:28px;right:28px;bottom:86px;height:2px;background:rgba(26,26,24,.14)}
  .p2 .rail .fill{position:absolute;inset:0;background:var(--red);transform-origin:left;transform:scaleX(0)}
  .p2 .sp{position:absolute;top:-7px;width:2px;height:16px;background:var(--ink)}
  .p2 .sp em{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font:700 11px var(--b);letter-spacing:.1em;white-space:nowrap;font-style:normal;opacity:.35;transition:opacity .3s,color .3s}
  .p2 .sp.on em{opacity:1;color:var(--red)}
  .p2 .bot{position:absolute;left:28px;right:28px;bottom:26px;display:flex;justify-content:space-between;opacity:.65}

  /* ---------- 3. MASCĂ MM ---------- */
  .p3 svg.full{position:absolute;inset:0;width:100%;height:100%}
  .p3 .topo path{fill:none;stroke:#2c2c29;stroke-width:1.1}
  .p3 .route-bg{fill:none;stroke:#2a2a27;stroke-width:6.5;stroke-linejoin:miter}
  .p3 .route{fill:none;stroke:var(--red);stroke-width:6.5;stroke-linejoin:miter;stroke-dasharray:1;stroke-dashoffset:1}
  .p3 .dot{fill:#EDEBE4}
  .p3 .chip rect{fill:var(--red)}
  .p3 .chip text{font-family:var(--d);font-size:5.2px;fill:#fff}
  .p3 .pct{position:absolute;left:24px;right:24px;bottom:22px;display:flex;justify-content:space-between;color:rgba(237,235,228,.6)}
  .p3 .pct b{font-family:var(--d);font-weight:400;font-size:22px;letter-spacing:.02em;color:#EDEBE4}
</style>
</head>
<body>
<div class="site"></div>
<div class="ui"><button data-v="1">1 · Start</button><button data-v="2">2 · Cronometru</button><button data-v="3">3 · Mască MM</button><button data-r>↻ din nou</button></div>
<div id="stage"></div>

<script src="../vendor/gsap.min.js"></script>
<script>
const MM_D = 'M12 50V16L24 36L36 16V50M36 16L48 36L60 16V50';
const MM_T = 'translate(7 0) skewX(-12)';
const stage = document.getElementById('stage');
const clamp = (v) => Math.max(0, Math.min(1, v));

/* progres simulat (în site: texturile + modelul), cu ezitări ca la o încărcare reală */
function fakeProgress(total = 3.2) {
  const p = { v: 0 }; const tl = gsap.timeline();
  [0.18, 0.31, 0.52, 0.6, 0.83, 0.94, 1].forEach((t, i, a) => tl.to(p, { v: t, duration: total / a.length * (0.6 + Math.random() * 0.8), ease: 'power1.out' }, i ? '+=' + (Math.random() * 0.18) : 0));
  p.done = new Promise((r) => tl.eventCallback('onComplete', r));
  return p;
}

/* ================= 1. START: monograma se desenează, lumini de start 5→1, „69”, ecranul se desparte ================= */
function v1(prog) {
  stage.innerHTML = `<div class="pl p1"><div class="half t"></div><div class="half b"></div>
    <div class="core"><svg class="mm" viewBox="0 0 96 64"><path pathLength="1" transform="${MM_T}" d="${MM_D}"/><text class="n69" transform="skewX(-12)" x="89" y="51" text-anchor="middle">69</text></svg>
    <div class="lights">${'<i></i>'.repeat(5)}</div><div class="count"><span>5</span></div></div>
    <div class="meta"><span class="lbl">Mihai Manole · <b>CNR 2026</b></span><span class="lbl pc">000</span></div></div>`;
  const root = stage.firstChild, path = root.querySelector('.mm path'), lights = [...root.querySelectorAll('.lights i')];
  const cnt = root.querySelector('.count span'), pc = root.querySelector('.pc');
  let shown = 5;
  const tick = () => {
    const p = prog.v; path.style.strokeDashoffset = 1 - p;
    const n = Math.min(5, Math.floor(p * 5 + 1e-6)); lights.forEach((l, i) => l.classList.toggle('on', i < n));
    const c = Math.max(1, 5 - n);
    if (c !== shown && n < 5) { shown = c; gsap.fromTo(cnt, { yPercent: 100 }, { yPercent: 0, duration: 0.35, ease: 'power3.out' }); cnt.textContent = c; }
    pc.textContent = String(Math.round(p * 100)).padStart(3, '0');
  };
  gsap.ticker.add(tick);
  prog.done.then(() => {
    gsap.ticker.remove(tick); tick();
    const tl = gsap.timeline();
    tl.to({}, { duration: 0.45 })
      .add(() => { lights.forEach((l) => l.classList.remove('on')); cnt.textContent = 'START'; gsap.fromTo(cnt, { yPercent: 100 }, { yPercent: 0, duration: 0.3, ease: 'power3.out' }); })
      .to(root.querySelector('.n69'), { opacity: 1, duration: 0.01 }, '<')
      .fromTo(root.querySelector('.n69'), { scale: 2.4, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.5, ease: 'back.out(3)' }, '<')
      .to(root.querySelector('.core'), { scale: 0.92, opacity: 0, duration: 0.6, ease: 'power2.in' }, '+=0.45')
      .to(root.querySelector('.half.t'), { yPercent: -101, duration: 1.1, ease: 'expo.inOut' }, '-=0.25')
      .to(root.querySelector('.half.b'), { yPercent: 101, duration: 1.1, ease: 'expo.inOut' }, '<')
      .fromTo('.site', { scale: 1.08 }, { scale: 1, duration: 1.6, ease: 'expo.out' }, '<0.2');
  });
}

/* ================= 2. CRONOMETRU: timp de probă care numără cât se încarcă, intermediare, cortina urcă arcuită ================= */
const FINAL = 221.269; // 3:41.269 — timp de probă simbolic
const fmt = (s) => { const m = Math.floor(s / 60), r = s - m * 60; return `${m}:${r.toFixed(3).padStart(6, '0')}`; };
function v2(prog) {
  const splits = [0.33, 0.66, 0.9];
  stage.innerHTML = `<div class="pl p2"><div class="panel">
    <div class="top"><svg class="mm" viewBox="0 0 96 64"><path pathLength="1" transform="${MM_T}" d="${MM_D}"/><text class="n69" transform="skewX(-12)" x="89" y="51" text-anchor="middle">69</text></svg><span class="lbl">PS 1 · Start</span></div>
    <div class="clock"><div class="t">0:00.<small>000</small></div><div class="sub">se încarcă proba</div></div>
    <div class="rail"><div class="fill"></div>${splits.map((s, i) => `<i class="sp" style="left:${s * 100}%"><em>S${i + 1} · —</em></i>`).join('')}</div>
    <div class="bot"><span class="lbl">Mihai Manole · Florin Dorca</span><span class="lbl">Škoda Fabia Rally2 Evo</span></div></div></div>`;
  const root = stage.firstChild, panel = root.querySelector('.panel'), t = root.querySelector('.t'), fill = root.querySelector('.fill');
  const sps = [...root.querySelectorAll('.sp')]; const hit = [false, false, false];
  const tick = () => {
    const p = prog.v, secs = p * FINAL, s = fmt(secs), k = s.lastIndexOf('.');
    t.innerHTML = `${s.slice(0, k + 1)}<small>${s.slice(k + 1)}</small>`; fill.style.transform = `scaleX(${p})`;
    splits.forEach((sp, i) => { if (!hit[i] && p >= sp) { hit[i] = true; sps[i].classList.add('on'); sps[i].querySelector('em').textContent = `S${i + 1} · ${fmt(sp * FINAL).slice(0, -2)}`; gsap.fromTo(sps[i], { scaleY: 2.2 }, { scaleY: 1, duration: 0.5, ease: 'power3.out' }); } });
  };
  gsap.ticker.add(tick);
  prog.done.then(() => {
    gsap.ticker.remove(tick); tick();
    root.querySelector('.sub').textContent = 'sosire';
    const tl = gsap.timeline();
    tl.fromTo(t, { color: '#D81F26' }, { color: '#1a1a18', duration: 0.6, ease: 'power2.out' })
      .to(root.querySelector('.clock'), { yPercent: -30, opacity: 0, duration: 0.7, ease: 'power3.in' }, '+=0.35')
      .to([root.querySelector('.top'), root.querySelector('.bot'), root.querySelector('.rail')], { opacity: 0, duration: 0.4 }, '<')
      // cortina urcă, iar marginea de jos se arcuiește în timpul mișcării (trecerea arcuită de pe referință)
      .to(panel, { yPercent: -100, duration: 1.15, ease: 'expo.inOut' }, '-=0.3')
      .fromTo(panel, { borderBottomLeftRadius: '0% 0vh', borderBottomRightRadius: '0% 0vh' }, { keyframes: [{ borderBottomLeftRadius: '50% 22vh', borderBottomRightRadius: '50% 22vh', duration: 0.6 }, { borderBottomLeftRadius: '50% 0vh', borderBottomRightRadius: '50% 0vh', duration: 0.55 }], ease: 'power1.inOut' }, '<')
      .fromTo('.site', { yPercent: 8 }, { yPercent: 0, duration: 1.3, ease: 'expo.out' }, '<0.35');
  });
}

/* ================= 3. MASCĂ MM: monograma e traseul, „69” merge pe el; la final literele devin fereastra și camera intră prin ele ================= */
function v3(prog) {
  const W = 1600, H = 1000, cx = W / 2, cy = H / 2 - 20;
  const narrow = innerWidth / innerHeight < 0.75, S0 = narrow ? 5.1 : 6.2;
  const topo = Array.from({ length: 14 }, (_, k) => {
    const r0 = 90 + k * 55, pts = [];
    for (let a = 0; a <= 64; a++) { const t = a / 64 * Math.PI * 2; const r = r0 * (1 + 0.18 * Math.sin(3 * t + k * 0.7) + 0.08 * Math.sin(5 * t - k)); pts.push([cx + Math.cos(t) * r * 1.35, cy + Math.sin(t) * r]); }
    return `<path d="M${pts.map((p) => p.map((v) => v.toFixed(1)).join(' ')).join('L')}Z"/>`;
  }).join('');
  const G = (id, extra = '') => `<g id="${id}" transform="translate(${cx} ${cy}) scale(${S0}) translate(-36 -33)" ${extra}>`;
  stage.innerHTML = `<div class="pl p3"><svg class="full" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">
    <defs><mask id="m3" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="#fff"/>
      ${G('mg')}<path id="mpath" d="${MM_D}" transform="${MM_T}" fill="none" stroke="#000" stroke-width="6.5" stroke-linejoin="miter" opacity="0"/></g></mask></defs>
    <g mask="url(#m3)"><rect width="${W}" height="${H}" fill="#111112"/><g class="topo">${topo}</g>
      ${G('vis')}<path class="route-bg" d="${MM_D}" transform="${MM_T}"/><path class="route" pathLength="1" d="${MM_D}" transform="${MM_T}"/>
        <g class="car"><circle class="dot" r="2.1"/><g class="chip" transform="translate(3 -9)"><rect width="10" height="6.6" rx="1.2"/><text x="5" y="5.2" text-anchor="middle">69</text></g></g></g></g>
  </svg><div class="pct"><span class="lbl">Mihai Manole · CNR 2026</span><b class="pc">0%</b></div></div>`;
  const root = stage.firstChild, route = root.querySelector('.route'), car = root.querySelector('.car'), pc = root.querySelector('.pc');
  const geo = root.querySelector('.route-bg'), L = geo.getTotalLength();
  const sk = Math.tan(-12 * Math.PI / 180);
  const topoG = root.querySelector('.topo'); gsap.to(topoG, { rotation: 8, svgOrigin: `${cx} ${cy}`, duration: 12, ease: 'none' });
  const tick = () => {
    const p = prog.v; route.style.strokeDashoffset = 1 - p;
    const pt = geo.getPointAtLength(L * p); car.setAttribute('transform', `translate(${pt.x + sk * pt.y + 7} ${pt.y})`);
    pc.textContent = Math.round(p * 100) + '%';
  };
  gsap.ticker.add(tick);
  prog.done.then(() => {
    gsap.ticker.remove(tick); tick();
    const mg = root.querySelector('#mg'), vis = root.querySelector('#vis'), mp = root.querySelector('#mpath');
    const z = { k: S0 };
    const set = () => { const tr = `translate(${cx} ${cy}) scale(${z.k}) translate(-36 -33)`; mg.setAttribute('transform', tr); vis.setAttribute('transform', tr); };
    const tl = gsap.timeline();
    tl.to(car, { opacity: 0, duration: 0.3 }, 0.2)
      .add(() => mp.setAttribute('opacity', 1), 0.45)            // literele devin fereastra spre site
      .to([root.querySelector('.route'), root.querySelector('.route-bg')], { opacity: 0, duration: 0.25 }, 0.45)
      .to(root.querySelector('.pct'), { opacity: 0, duration: 0.3 }, 0.45)
      .to(z, { k: S0 * 70, duration: 1.5, ease: 'expo.in', onUpdate: set }, 0.9) // camera intră prin tija din mijloc
      .fromTo('.site', { scale: 1.25 }, { scale: 1, duration: 2.1, ease: 'expo.out' }, 1.9)
      .set(root, { display: 'none' }, 2.4);
  });
}

/* demo */
const V = { 1: v1, 2: v2, 3: v3 }; let cur = +(new URLSearchParams(location.search).get('v') || 1);
function run(v) {
  cur = v; gsap.globalTimeline.clear(); gsap.set('.site', { clearProps: 'all' });
  document.querySelectorAll('.ui button[data-v]').forEach((b) => b.classList.toggle('on', +b.dataset.v === v));
  V[v](fakeProgress());
}
document.querySelectorAll('.ui button[data-v]').forEach((b) => b.onclick = () => run(+b.dataset.v));
document.querySelector('[data-r]').onclick = () => run(cur);
if (new URLSearchParams(location.search).has('noui')) document.querySelector('.ui').style.display = 'none';
document.fonts.ready.then(() => run(cur));
</script>
</body>
</html>
